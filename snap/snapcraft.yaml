name: open-planner-studio
base: core22
# Versie wordt in CI overschreven met het release-versienummer (zie .github/workflows/snap.yml).
version: '0.0.0'
title: Open Planner Studio
summary: Construction scheduling with Gantt charts and Critical Path Method
description: |
  Open Planner Studio is a desktop application for construction planning:
  Gantt charts, Critical Path Method (CPM) scheduling, resources and
  calendars, with IFC 4.3 (buildingSMART) as its native file format — no
  separate project format, no lock-in.

  Key features:
  - Interactive Gantt chart rendered on Canvas, with drag & drop (including
    vertical drag to reorder or reparent tasks) and zoom
  - Critical Path Method (CPM) with automatic critical-path and float
    calculation
  - Work Breakdown Structure (WBS) with collapsible task groups
  - IFC 4.3 native file format — open and save directly in the
    buildingSMART standard
  - Resource libraries shared across projects, with per-item provenance
    tracking
  - Spreadsheet-style table view for quick bulk editing
  - Import/export for CSV, Microsoft Project, and Primavera P6
  - Construction-specific calendars: holidays, seasonal shutdowns,
    inspection milestones, phasing
  - Built-in report view with a live, configurable print preview
  - 14 languages, including right-to-left support for Arabic and Persian
  - Optional AI assistant integration (MCP) that can drive the open plan
    directly, with pause/read-only safety flags and an activity log

  Open Planner Studio is free and open source (LGPL-3.0-or-later), part of
  the OpenAEC Foundation family of applications, and built with Tauri for
  a small, native footprint.

grade: stable
confinement: strict

apps:
  open-planner-studio:
    # Snapnaam == appnaam, dus het commando is gewoon `open-planner-studio`.
    command: usr/bin/open-planner-studio
    # De gnome-extensie wired GTK3 + WebKitGTK uit het GNOME-platform-snap en voegt
    # zelf de desktop/wayland/x11/opengl/gsettings-plugs toe (auto-connected).
    extensions: [gnome]
    desktop: usr/share/applications/open-planner-studio.desktop
    plugs:
      # Alleen de plugs die de gnome-extensie niet al levert:
      - home            # IFC openen/opslaan/exporteren in de home-map
      - removable-media # idem op externe schijven/USB
      - network         # update-check, extensie-catalogus
      - browser-support # WebKit-rendering/sandbox
      - audio-playback

parts:
  open-planner-studio:
    plugin: nil
    # De CI-stap kopieert de gepubliceerde release-deb naar de project-root als
    # `open-planner-studio.deb`; we herverpakken die i.p.v. opnieuw te bouwen.
    override-build: |
      set -eu
      dpkg-deb -x "${CRAFT_PROJECT_DIR}/open-planner-studio.deb" "${CRAFT_PART_INSTALL}"
      # Tauri's desktop-file heeft spaties in de bestandsnaam; hernoem naar een
      # stabiel pad zodat de `desktop:`-sleutel hierboven klopt.
      mv "${CRAFT_PART_INSTALL}/usr/share/applications/Open Planner Studio.desktop" \
         "${CRAFT_PART_INSTALL}/usr/share/applications/open-planner-studio.desktop"
    # stage-packages bewust leeg: GTK3 + WebKitGTK komen uit de gnome-runtime.
    # Ontbreekt er bij de verificatie-run toch een lib, dan voegen we 'm hier toe
    # (itereren via de workflow_dispatch-route, niet gokken).
